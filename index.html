<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FNF Spritesheet Studio</title>
    <!-- Librería necesaria para crear el archivo ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { 
            background-color: #1a1a24; 
            color: white; 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
        }
        h1 { color: #ff3366; margin-bottom: 5px; font-size: 24px; }
        p.subtitle { color: #aaa; margin-bottom: 20px; font-size: 14px; }
        
        .card { 
            background-color: #0b0b13; 
            border: 2px dashed #ff3366; 
            border-radius: 10px; 
            padding: 20px; 
            margin-bottom: 20px; 
        }
        
        .config-card { 
            background-color: #7d1c44;
            border-radius: 10px; 
            padding: 20px; 
            text-align: left; 
            margin-bottom: 20px;
        }
        .config-card h2 { 
            margin-top: 0; 
            text-align: center;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
        }
        
        button { 
            background-color: #ff3366; 
            color: white; 
            border: none; 
            padding: 15px 20px; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            width: 90%; 
            cursor: pointer; 
            transition: 0.3s;
            margin-top: 5px;
        }
        button:active { transform: scale(0.95); }
        
        .btn-success { background-color: #4CAF50 !important; }
        #btnProcesar:disabled { background-color: #555; color: #888; cursor: not-allowed; }
        #btnProcesar:not(:disabled) { background-color: #4CAF50; }

        input[type="file"] { display: none; }
        
        .config-row { 
            display: flex; 
            align-items: center; 
            margin-bottom: 15px; 
            font-size: 15px;
        }
        .config-row input[type="checkbox"] { 
            transform: scale(1.5); 
            margin-right: 15px; 
        }
        .config-row input[type="number"] { 
            width: 40px; 
            text-align: center; 
            margin: 0 10px; 
            padding: 5px; 
            border-radius: 5px; 
            border: none; 
            font-weight: bold; 
        }
        .config-row input[type="range"] {
            accent-color: #ff3366;
            cursor: pointer;
        }

        .anim-card {
            background-color: #0b0b13;
            border: 1px solid #ff3366;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
        }
        .anim-title {
            color: white;
            text-transform: uppercase;
            margin-top: 0;
            font-size: 14px;
        }
        canvas {
            background-color: #120c24;
            border: 1px solid #333;
            max-width: 100%;
            border-radius: 5px;
            margin-top: 10px;
        }

        /* Estilos del Boyfriend interactivo */
        #bf-mascot {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background-color: #31b0d1; /* Color Cyan de BF */
            border: 4px solid #1a1a24;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s;
            z-index: 1000;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #bf-mascot:active {
            transform: scale(0.8) translateY(5px);
        }
        #bf-mascot::after {
            content: '🎵';
            position: absolute;
            top: -15px;
            right: -10px;
            font-size: 24px;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
        }
        #bf-mascot.singing::after {
            opacity: 1;
            transform: translateY(-15px);
        }
    </style>
</head>
<body>

    <h1>FNF Spritesheet Studio</h1>
    <p class="subtitle">Creador Independiente de Sprites para Mods</p>

    <div class="card">
        <h3 style="margin-top:0;">PNG</h3>
        <button id="btnPng" onclick="document.getElementById('pngInput').click()">Seleccionar PNG</button>
        <input type="file" id="pngInput" accept="image/png">
    </div>

    <div class="card">
        <h3 style="margin-top:0;">XML</h3>
        <button id="btnXml" onclick="document.getElementById('xmlInput').click()">Seleccionar XML</button>
        <input type="file" id="xmlInput" accept=".xml">
    </div>

    <div class="config-card">
        <h2>Configuración</h2>
        <div class="config-row">
            <input type="checkbox" id="eliminarDuplicados">
            <label for="eliminarDuplicados">Eliminar frames duplicados</label>
        </div>
        <div class="config-row">
            <input type="checkbox" id="addFrames">
            <label for="addFrames">Añadir </label>
            <input type="number" id="numFrames" value="6" min="1">
            <label for="addFrames"> frames duplicados al final</label>
        </div>
        <div class="config-row">
            <label for="globalBPM" style="margin-right: 15px;">BPM Global:</label>
            <input type="number" id="globalBPM" value="100" min="1" style="width: 60px;" onchange="actualizarBPM(this.value)">
        </div>
        <div class="config-row">
            <label for="globalRotation" style="margin-right: 15px;">Rotación:</label>
            <input type="range" id="globalRotation" value="0" min="0" max="360" step="1" style="flex-grow: 1;" oninput="actualizarRotacion(this.value)">
            <span id="rotationVal" style="margin-left: 10px; font-weight: bold; width: 45px; text-align: right;">0°</span>
        </div>
        <div class="config-row">
            <label for="globalOpacity" style="margin-right: 15px;">Opacidad:</label>
            <input type="range" id="globalOpacity" value="1" min="0" max="1" step="0.05" style="flex-grow: 1;" oninput="actualizarOpacidad(this.value)">
            <span id="opacityVal" style="margin-left: 10px; font-weight: bold; width: 45px; text-align: right;">100%</span>
        </div>
        <div class="config-row">
            <input type="checkbox" id="usarTinteColor" onchange="toggleTinte(this.checked)">
            <label for="usarTinteColor" style="margin-right: 15px;">Activar Tinte de Color:</label>
            <input type="color" id="globalColor" value="#ff3366" disabled onchange="actualizarColor(this.value)" style="cursor: pointer; border: none; width: 40px; height: 30px; background: none;">
        </div>
        <br>
        <center>
            <button id="btnProcesar" disabled onclick="procesarArchivos()">Esperando archivos...</button>
        </center>
    </div>

    <div id="resultados" style="display: none;">
        <div class="config-card" style="background-color: #4CAF50; text-align: center;">
            <h3 style="margin-top:0; color: white;">¡Sprites Generados!</h3>
            <button onclick="descargarZip()" style="background-color: white; color: #4CAF50; width: auto; padding: 15px 30px;">⬇️ Descargar ZIP</button>
        </div>
        <div id="listaAnimaciones"></div>
    </div>

    <!-- Botón de Boyfriend Distracción -->
    <div id="bf-mascot" onclick="playBfBeep()" title="Beep bop!">🧢</div>

    <script>
        // --- CÓDIGO DEL SINTETIZADOR DE BOYFRIEND ---
        let audioCtx;
        function playBfBeep() {
            // Inicializa el motor de audio solo cuando el usuario interactúa
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            // FNF usa ondas que suenan a retro/chiptune
            const waveforms = ['square', 'sawtooth', 'triangle'];
            osc.type = waveforms[Math.floor(Math.random() * waveforms.length)];
            
            // Frecuencias agudas (Notas de Boyfriend)
            const freqs = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00]; 
            osc.frequency.setValueAtTime(freqs[Math.floor(Math.random() * freqs.length)], audioCtx.currentTime);
            
            // Hace que suene como un golpe rápido (Bop!)
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);

            // Animación visual de la nota musical
            const bf = document.getElementById('bf-mascot');
            bf.classList.remove('singing');
            void bf.offsetWidth; // Forzar reinicio de animación
            bf.classList.add('singing');
        }
        // ---------------------------------------------

        const pngInput = document.getElementById('pngInput');
        const xmlInput = document.getElementById('xmlInput');
        const btnPng = document.getElementById('btnPng');
        const btnXml = document.getElementById('btnXml');
        const btnProcesar = document.getElementById('btnProcesar');

        let imageElement = new Image();
        let xmlDocument = null;
        let activeAnimations = [];
        let currentTimers = {};
        
        let pngSeleccionado = false;
        let xmlSeleccionado = false;
        
        let bpmGlobal = 100;
        let rotacionGlobal = 0;
        let opacidadGlobal = 1;
        let usarTinte = false;
        let colorGlobal = '#ff3366';

        function actualizarBPM(valor) {
            bpmGlobal = parseFloat(valor) || 100;
        }

        function actualizarRotacion(valor) {
            rotacionGlobal = parseFloat(valor) || 0;
            document.getElementById('rotationVal').textContent = rotacionGlobal + '°';
        }

        function actualizarOpacidad(valor) {
            opacidadGlobal = parseFloat(valor) || 1;
            document.getElementById('opacityVal').textContent = Math.round(opacidadGlobal * 100) + '%';
        }

        function toggleTinte(activado) {
            usarTinte = activado;
            document.getElementById('globalColor').disabled = !activado;
        }

        function actualizarColor(valor) {
            colorGlobal = valor;
        }

        function cambiarBeats(animId, valor) {
            let anim = activeAnimations.find(a => a.id === animId);
            let num = parseFloat(valor);
            if (num > 3) num = 3; 
            if (num < 0.1) num = 0.1;
            anim.beats = num;
            document.getElementById(`input-beats-${animId}`).value = num;
        }

        function comprobarArchivos() {
            if (pngSeleccionado && xmlSeleccionado) {
                btnProcesar.disabled = false;
                btnProcesar.innerText = "Procesar Proyecto";
            }
        }

        pngInput.addEventListener('change', function(evento) {
            if (evento.target.files.length > 0) {
                const file = evento.target.files[0];
                btnPng.textContent = "✔️ " + file.name;
                btnPng.classList.add('btn-success');
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    imageElement.onload = () => {
                        pngSeleccionado = true;
                        comprobarArchivos();
                    };
                    imageElement.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        xmlInput.addEventListener('change', function(evento) {
            if (evento.target.files.length > 0) {
                const file = evento.target.files[0];
                btnXml.textContent = "✔️ " + file.name;
                btnXml.classList.add('btn-success');
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    xmlDocument = new DOMParser().parseFromString(e.target.result, "text/xml");
                    xmlSeleccionado = true;
                    comprobarArchivos();
                };
                reader.readAsText(file);
            }
        });

        function procesarArchivos() {
            activeAnimations = [];
            Object.values(currentTimers).forEach(clearTimeout);
            currentTimers = {};

            const removeDups = document.getElementById('eliminarDuplicados').checked;
            const addFrames = document.getElementById('addFrames').checked;
            const addCount = parseInt(document.getElementById('numFrames').value) || 0;

            const subTextures = xmlDocument.getElementsByTagName("SubTexture");
            if (subTextures.length === 0) {
                alert("Error: El XML no tiene formato de FNF (Faltan las SubTextures).");
                return;
            }

            let tempMap = new Map();
            for (let st of subTextures) {
                const rawName = st.getAttribute("name");
                let baseName = rawName.match(/^(.*?)(\d+)$/) ? rawName.match(/^(.*?)(\d+)$/)[1].trim() : rawName;

                const frame = {
                    name: rawName,
                    x: parseInt(st.getAttribute("x")) || 0,
                    y: parseInt(st.getAttribute("y")) || 0,
                    width: parseInt(st.getAttribute("width")) || 0,
                    height: parseInt(st.getAttribute("height")) || 0,
                    frameX: parseInt(st.getAttribute("frameX")) || 0,
                    frameY: parseInt(st.getAttribute("frameY")) || 0,
                    frameWidth: parseInt(st.getAttribute("frameWidth")) || parseInt(st.getAttribute("width")),
                    frameHeight: parseInt(st.getAttribute("frameHeight")) || parseInt(st.getAttribute("height"))
                };

                if (!tempMap.has(baseName)) tempMap.set(baseName, []);
                tempMap.get(baseName).push(frame);
            }

            let idx = 0;
            for (const [name, rawFrames] of tempMap.entries()) {
                let processedFrames = [...rawFrames];

                if (removeDups) {
                    let unique = [];
                    let last = null;
                    for(let f of processedFrames) {
                        if(!last || last.x !== f.x || last.y !== f.y || last.width !== f.width || last.height !== f.height) {
                            unique.push(f);
                            last = f;
                        }
                    }
                    processedFrames = unique;
                }

                if (addFrames && addCount > 0 && processedFrames.length > 0) {
                    const lastF = processedFrames[processedFrames.length - 1];
                    for(let i = 0; i < addCount; i++) {
                        processedFrames.push(JSON.parse(JSON.stringify(lastF)));
                    }
                }

                activeAnimations.push({ id: idx, name: name, frames: processedFrames, beats: 1 });
                idx++;
            }
            mostrarResultados();
        }

        function mostrarResultados() {
            const contenedor = document.getElementById('listaAnimaciones');
            contenedor.innerHTML = '';

            activeAnimations.forEach((anim) => {
                const card = document.createElement('div');
                card.className = "anim-card";
                
                let maxW = 0; let maxH = 0;
                anim.frames.forEach(f => {
                    const fw = f.frameWidth || f.width;
                    const fh = f.frameHeight || f.height;
                    if (fw > maxW) maxW = fw;
                    if (fh > maxH) maxH = fh;
                });

                card.innerHTML = `
                    <h3 class="anim-title">${anim.name}</h3>
                    <div style="margin-bottom: 10px; color: #aaa; font-size: 14px;">
                        <label>Beats:</label>
                        <input type="number" id="input-beats-${anim.id}" value="${anim.beats}" min="0.1" max="3" step="0.1" onchange="cambiarBeats(${anim.id}, this.value)" style="width: 50px; text-align: center; border-radius: 5px; border: none; padding: 2px; margin-left: 5px; font-weight: bold;">
                    </div>
                    <canvas id="canvas-${anim.id}"></canvas>
                `;
                contenedor.appendChild(card);
                reproducirAnimacion(anim.id, maxW, maxH);
            });

            document.getElementById('resultados').style.display = 'block';
            document.getElementById('resultados').scrollIntoView({ behavior: 'smooth' });
        }

        function reproducirAnimacion(animId, maxW, maxH) {
            const anim = activeAnimations.find(a => a.id === animId);
            const canvas = document.getElementById(`canvas-${animId}`);
            const ctx = canvas.getContext('2d');
            
            let scale = 1;
            if (maxW > 300) scale = 300 / maxW; 
            
            canvas.width = maxW * scale; 
            canvas.height = maxH * scale;
            let frameActual = 0;

            function loop() {
                if (!anim.frames || anim.frames.length === 0) return;
                
                const frame = anim.frames[frameActual];
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                const fw = frame.frameWidth || frame.width;
                const fh = frame.frameHeight || frame.height;
                const fx = frame.frameX || 0;
                const fy = frame.frameY || 0;

                ctx.save();
                ctx.scale(scale, scale);
                ctx.translate(maxW / 2, maxH / 2);
                ctx.rotate(rotacionGlobal * Math.PI / 180);
                ctx.globalAlpha = opacidadGlobal;

                const dx = -maxW / 2 + (maxW - fw) / 2 - fx;
                const dy = -maxH / 2 + (maxH - fh) / 2 - fy;

                ctx.drawImage(imageElement, frame.x, frame.y, frame.width, frame.height, dx, dy, frame.width, frame.height);
                
                if (usarTinte) {
                    ctx.globalCompositeOperation = 'source-atop';
                    ctx.fillStyle = colorGlobal;
                    ctx.fillRect(dx, dy, frame.width, frame.height);
                    ctx.globalCompositeOperation = 'source-over';
                }

                ctx.restore();
                
                frameActual = (frameActual + 1) % anim.frames.length;
                
                const duracionSegundos = anim.beats * (60 / bpmGlobal);
                let tiempoPorFrameMs = (duracionSegundos * 1000) / anim.frames.length;
                if (tiempoPorFrameMs < 10) tiempoPorFrameMs = 10; 

                currentTimers[animId] = setTimeout(loop, tiempoPorFrameMs);
            }
            loop();
        }

        async function descargarZip() {
            if (typeof JSZip === 'undefined') {
                alert("Error: No se pudo cargar JSZip. Prueba desde el navegador (Chrome) y revisa tu internet.");
                return;
            }
